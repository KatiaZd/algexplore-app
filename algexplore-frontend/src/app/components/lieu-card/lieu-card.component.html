<div
  class="card"
  role="button"
  tabindex="0"
  (click)="goToDetail()"
  (keyup.enter)="goToDetail()"
  (keyup.space)="goToDetail()"
  [attr.aria-label]="'Voir le détail du lieu ' + lieu.nom"
>
  <img *ngIf="lieu.coverUrl" [src]="lieu.coverUrl" [alt]="lieu.nom" loading="lazy" />

  <img *ngIf="!lieu.coverUrl" src="assets/default-cover.jpg" alt="Image non disponible" />
  <div class="card-content">
    <h3>{{ lieu.nom }}</h3>
  </div>
</div>
