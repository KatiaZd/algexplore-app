<section class="favoris">
  <h1>Mes favoris</h1>

  <p *ngIf="errorMessage" class="favoris__error">
    {{ errorMessage }}
  </p>

  <p *ngIf="!errorMessage && favoris.length === 0">
    Aucun favori pour le moment.
  </p>

  <div class="grid" *ngIf="!errorMessage && favoris.length > 0">
    <article
      class="card"
      *ngFor="let f of favoris"
      tabindex="0"
      role="link"
      (click)="openLieu(f.lieuId)"
      (keydown.enter)="openLieu(f.lieuId)"
      [attr.aria-label]="'Voir le lieu ' + f.lieu.nom"
    >
      <h3 class="card__title">{{ f.lieu.nom }}</h3>

      <button
        type="button"
        class="card__remove"
        [attr.aria-label]="'Retirer ' + f.lieu.nom + ' des favoris'"
        (click)="$event.stopPropagation(); remove(f.lieuId)"
      >
        Retirer
      </button>
    </article>
  </div>
</section>
