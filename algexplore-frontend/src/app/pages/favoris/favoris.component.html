<section class="favoris">
  <h1>Mes favoris</h1>

  <p *ngIf="errorMessage" class="favoris__error">
    {{ errorMessage }}
  </p>

  <div *ngIf="!errorMessage && favoris.length === 0">
    Aucun favori pour le moment.
  </div>

  <ul *ngIf="favoris.length > 0">
    <li *ngFor="let f of favoris">
      {{ f.lieu.nom }}
      <button (click)="remove(f.lieuId)">Retirer</button>
    </li>
  </ul>
</section>
