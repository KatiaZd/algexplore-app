name: CI - Backend tests

on:
  push:
    branches:
      - develop
      - feat/tests-backend
  pull_request:
    branches:
      - develop

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: algexplore-backend
        run: npm install

      - name: Run backend tests
        working-directory: algexplore-backend
        run: npm test
